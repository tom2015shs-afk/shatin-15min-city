.leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }

/* Animation */
.result-item { 
    opacity: 0; 
    transform: translateX(-40px); 
    animation: rollInLeft 0.5s forwards; 
}
@keyframes rollInLeft { 
    to { opacity: 1; transform: translateX(0); } 
}

/* White Category Text */
.feature-btn span:last-child {

#app-container {

#side-panel {

#map-container {

@media (min-width: 768px) {

// ==================== HELPERS & MAP FUNCTIONS (same as before) ====================
function haversineDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function calculateWalkingTime(distanceKm) {
    return Math.round((distanceKm / 4.8) * 60);
}
function initMapLayers() {

        "Satellite": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri' }),
        "Terrain": L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution: '© OpenTopoMap' }),
        "OSM Hot": L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }),
        "Stamen Terrain": L.tileLayer('https://stamen-tiles.a.ssl.fastly.net/terrain/{z}/{x}/{y}.png', { attribution: 'Map tiles by Stamen Design' })
    };
}
function createLayerButtons() {
    const container = document.getElementById('layer-controls');
    container.innerHTML = '';
    Object.keys(baseLayers).forEach((name, i) => {
        const btn = document.createElement('button');
        btn.textContent = name;
        btn.className = `px-4 py-2 text-sm font-medium rounded-3xl transition-all ${i === 0 ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 hover:border-emerald-300'}`;
        btn.onclick = () => {
            if (currentBaseLayer) map.removeLayer(currentBaseLayer);
            currentBaseLayer = baseLayers[name];
            currentBaseLayer.addTo(map);
            document.querySelectorAll('#layer-controls button').forEach(b => {
                const active = b.textContent === name;
                b.classList.toggle('bg-emerald-600', active);
                b.classList.toggle('text-white', active);
            });
        };
        container.appendChild(btn);
    });
}
function initMap() {
    map = L.map('map', { zoomControl: true }).setView([22.387, 114.195], 14.8);
    initMapLayers();
    currentBaseLayer = baseLayers['Standard'];
    currentBaseLayer.addTo(map);
}

// ==================== CORE FUNCTIONS ====================
function findNearestNow() {
    if (!userLatLng) return alert("Please set your location first using GPS or Pin mode!");
    let filtered = allPOIs.filter(p => p.type === currentFeatureType);
    if (!filtered.length) return alert("No " + currentFeatureType + " found");
    let closest = filtered.reduce((a, b) => {
        const da = haversineDistance(userLatLng.lat, userLatLng.lng, a.lat, a.lon);
        const db = haversineDistance(userLatLng.lat, userLatLng.lng, b.lat, b.lon);
        return da < db ? a : b;
    });
    showRouteToPOI(closest.lat, closest.lon, closest.name);
}

function locateUser() {
    if (!navigator.geolocation) return alert("Geolocation not supported");
    const statusEl = document.getElementById('location-status');
    statusEl.classList.remove('hidden');
    document.getElementById('current-location-text').innerHTML = 'Getting GPS location...';
    navigator.geolocation.getCurrentPosition(pos => {
        userLatLng = L.latLng(pos.coords.latitude, pos.coords.longitude);
        if (userMarker) userMarker.remove();
        userMarker = L.marker(userLatLng, { icon: L.divIcon({ html: `<div style="background:#10b981;width:32px;height:32px;border-radius:9999px;border:5px solid white;box-shadow:0 0 0 5px #10b981;color:white;font-size:20px;display:flex;align-items:center;justify-content:center;">👤</div>`, iconSize: [32, 32] }) }).addTo(map).bindPopup("You are here").openPopup();
        map.flyTo(userLatLng, 16);
        document.getElementById('current-location-text').innerHTML = `📍 Your GPS location<br><span class="text-xs">${userLatLng.lat.toFixed(4)}, ${userLatLng.lng.toFixed(4)}</span>`;
        loadPOIs();
    }, () => alert("Unable to get location"), { enableHighAccuracy: true });
}

function enablePinMode() {
    isPinMode = true;
    document.getElementById('pin-btn').classList.add('!bg-emerald-600', '!text-white', '!border-transparent');
}

function setPinnedPosition(latlng) {
    userLatLng = latlng;
    if (userMarker) userMarker.remove();
    userMarker = L.marker(userLatLng, { icon: L.divIcon({ html: `<div style="background:#10b981;width:32px;height:32px;border-radius:9999px;border:5px solid white;box-shadow:0 0 0 6px rgba(16,185,129,0.3);color:white;font-size:20px;display:flex;align-items:center;justify-content:center;">📍</div>`, iconSize: [32, 32] }) }).addTo(map).bindPopup("Pinned position").openPopup();
    document.getElementById('location-status').classList.remove('hidden');
    document.getElementById('current-location-text').innerHTML = `📌 Pinned location<br><span class="text-xs">${userLatLng.lat.toFixed(4)}, ${userLatLng.lng.toFixed(4)}</span>`;
    disablePinMode();
    loadPOIs();
}

function disablePinMode() {
    isPinMode = false;
    document.getElementById('pin-btn').classList.remove('!bg-emerald-600', '!text-white', '!border-transparent');
}

function toggleLiveWalking() {
    if (isLiveWalking) stopLiveWalking(); else startLiveWalking();
}

function startLiveWalking() {
    if (!navigator.geolocation) return alert("Geolocation not supported");
    isLiveWalking = true;
    const btn = document.getElementById('live-btn');
    btn.innerHTML = `⏹️ Stop Live Walking`;
    btn.classList.add('bg-red-500', 'hover:bg-red-600');
    document.getElementById('location-status').classList.remove('hidden');
    document.getElementById('current-location-text').innerHTML = '🚶 Live GPS active';
    watchId = navigator.geolocation.watchPosition(pos => {
        userLatLng = L.latLng(pos.coords.latitude, pos.coords.longitude);
        if (userMarker) userMarker.remove();
        userMarker = L.marker(userLatLng, { icon: L.divIcon({ html: `<div style="background:#10b981;width:34px;height:34px;border-radius:9999px;border:5px solid white;box-shadow:0 0 0 6px rgba(16,185,129,0.4);color:white;font-size:22px;display:flex;align-items:center;justify-content:center;animation:pulse 1.8s infinite;">🚶</div>`, iconSize: [34, 34] }) }).addTo(map).bindPopup("You are here (Live)").openPopup();
        map.flyTo(userLatLng, map.getZoom(), { animate: true, duration: 1.2 });
        loadPOIs();
        if (lastDestination) checkIfOffRoute();
    }, () => {}, { enableHighAccuracy: true, maximumAge: 3000 });
    offRouteCheckInterval = setInterval(() => { if (lastDestination && isLiveWalking) checkIfOffRoute(); }, 7000);
}

function stopLiveWalking() {
    if (watchId) navigator.geolocation.clearWatch(watchId);
    if (offRouteCheckInterval) clearInterval(offRouteCheckInterval);
    isLiveWalking = false;
    document.getElementById('live-btn').innerHTML = `🚶 Start Live Walking Mode`;
    document.getElementById('live-btn').classList.remove('bg-red-500', 'hover:bg-red-600');
    dismissOffRouteAlert();
}

function checkIfOffRoute() {
    if (!userLatLng || !lastDestination) return;
    const dist = haversineDistance(userLatLng.lat, userLatLng.lng, lastDestination.lat, lastDestination.lon);
    if (dist > 0.18) document.getElementById('offroute-alert').classList.remove('hidden');
}

function recalculateCurrentRoute() {
    dismissOffRouteAlert();
    if (lastDestination) showRouteToPOI(lastDestination.lat, lastDestination.lon, lastDestination.name);
}

function dismissOffRouteAlert() {
    document.getElementById('offroute-alert').classList.add('hidden');
}

function showRouteToPOI(destLat, destLon, name) {
    if (!userLatLng) return alert("Please set your position first!");
    lastDestination = { lat: destLat, lon: destLon, name: name };
    clearRoute();
    currentRouteControl = L.Routing.control({
        waypoints: [userLatLng, L.latLng(destLat, destLon)],
        router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1', profile: 'foot' }),
        lineOptions: { styles: [{ color: '#10b981', weight: 6 }] },
        fitSelectedRoutes: true
    }).addTo(map);
    currentRouteControl.on('routesfound', e => {
        const route = e.routes[0];
        const time = Math.round(route.summary.totalTime / 60);
        const dist = (route.summary.totalDistance / 1000).toFixed(1);
        document.getElementById('route-summary').innerHTML = `
            <div class="flex items-center gap-3 flex-1">
                <span class="font-semibold text-3xl text-emerald-600">${time}</span>
                <span class="text-gray-500">min walk</span>
                <div class="h-5 w-px bg-gray-300 mx-3"></div>
                <div class="font-medium">${dist} km to <strong>${name}</strong></div>
            </div>
            <div class="flex gap-2">
                <a href="https://www.google.com/maps/dir/?api=1&origin=${userLatLng.lat},${userLatLng.lng}&destination=${destLat},${destLon}&travelmode=walking" target="_blank" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-3xl flex items-center gap-2">🗺️ Google Maps</a>
            </div>
            <button onclick="clearRoute()" class="ml-2 px-5 py-3 text-sm font-medium bg-gray-100 hover:bg-gray-200 rounded-3xl">Clear</button>`;
        document.getElementById('route-summary').classList.remove('hidden');
    });
}

function clearRoute() {
    if (currentRouteControl) map.removeControl(currentRouteControl);
    currentRouteControl = null;
    document.getElementById('route-summary').classList.add('hidden');
}

function setFeatureType(type) {
    currentFeatureType = type;
    document.querySelectorAll('.feature-btn').forEach(btn => {
        btn.dataset.active = btn.getAttribute('onclick').includes(`'${type}'`) ? 'true' : 'false';
    });
    loadPOIs();
}

function loadPOIs() {
    const container = document.getElementById('results-list');
    container.innerHTML = `<div class="flex justify-center py-12"><div class="animate-spin w-8 h-8 border-4 border-emerald-600 border-t-transparent rounded-full"></div></div>`;
    let filtered = allPOIs
        .filter(p => p.type === currentFeatureType)
        .map(p => {
            if (!userLatLng) return p;
            const dist = haversineDistance(userLatLng.lat, userLatLng.lng, p.lat, p.lon);
            const time = calculateWalkingTime(dist);
            return { ...p, distanceKm: dist, timeMin: time };
        })
        .filter(p => !userLatLng || p.timeMin <= 15)
        .sort((a, b) => (a.timeMin || 0) - (b.timeMin || 0));
    document.getElementById('results-count').textContent = `(${filtered.length} found)`;
    if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-gray-400"><p class="text-4xl mb-3">😕</p><p>No ${currentFeatureType} within 15 min walk</p></div>`;
        clearMarkers();
        return;
    }
    let html = '';
    filtered.forEach((poi, index) => {
        const emoji = { clinic: '🏥', hospital: '🏨', pharmacy: '💊', market: '🛒', park: '🌳' }[poi.type];
        html += `<div class="result-item bg-white border border-gray-100 hover:border-emerald-300 rounded-3xl p-5 cursor-pointer transition-all hover:shadow-md" style="animation-delay: ${index * 60}ms" onclick="showRouteToPOI(${poi.lat}, ${poi.lon}, '${poi.name.replace(/'/g, "\\'")}')">
            <div class="flex gap-4">
                <div class="text-4xl flex-shrink-0">${emoji}</div>
                <div class="flex-1 min-w-0">
                    <div class="font-semibold text-gray-800">${poi.name}</div>
                    <div class="text-xs text-gray-500 mt-1 line-clamp-2">${poi.address}</div>
                    ${poi.timeMin ? `<div class="mt-3 text-sm inline-flex items-center gap-2"><span class="text-emerald-600 font-medium">${poi.timeMin} min walk</span><span class="text-gray-400">•</span><span>${poi.distanceKm.toFixed(1)} km</span></div>` : ''}
                </div>
            </div>
        </div>`;
    });
    container.innerHTML = html;
    clearMarkers();
    filtered.forEach(poi => {
        const marker = L.marker([poi.lat, poi.lon]).addTo(map).bindPopup(`<b>${poi.name}</b><br><small>${poi.address}</small><br><br><button onclick="showRouteToPOI(${poi.lat}, ${poi.lon}, '${poi.name.replace(/'/g, "\\'")}'); this.closest('.leaflet-popup').remove();" class="mt-2 text-xs bg-emerald-600 text-white px-4 py-1.5 rounded-3xl w-full">Show Route</button>`);
        poiMarkers.push(marker);
    });
}

function clearMarkers() {
    poiMarkers.forEach(m => m.remove());
    poiMarkers = [];
}

function clearLocation() {
    if (userMarker) userMarker.remove();
    userMarker = userLatLng = null;
    document.getElementById('location-status').classList.add('hidden');
    clearRoute();
    loadPOIs();
}

// ==================== INIT ====================
window.onload = () => {
    initMap();
    createLayerButtons();
    map.on('click', e => { if (isPinMode) setPinnedPosition(e.latlng); });
    setFeatureType('hospital');
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
};
</script>
</body>
</html>
